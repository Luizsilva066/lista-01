<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 19</title>
</head>
<body>
    <script>
        const base = parseFloat(prompt("Digite a base do Triangulo: "))
        const altura = parseFloat(prompt("Digite a altura do Triangulo: "))
        const hipotenusa = Math.sqrt(Math.pow(base, 2) + Math.pow(altura, 2));

        alert(`A Hipotenusa do Triangulo é: ${hipotenusa.toFixed(2)}`)

    </script>
</body>
</html>
