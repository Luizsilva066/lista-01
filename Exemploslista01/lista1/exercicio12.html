<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 12</title>
</head>
<body>
    <script>
        let nota01 = parseFloat(prompt("Digite a sua nota do primeiro Bimestre: "))
        let nota02 = parseFloat(prompt("Digite a sua nota do segundo Bimestre: "))
        let nota03 = parseFloat(prompt("Digite a sua nota do terceiro Bimestre: "))

        let soma = (nota01 + nota02 + nota03) / 3

        alert("A sua nota final é " + soma.toFixed(1))
    </script>
</body>
</html>
