<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 18</title>
</head>
<body>
    <script>
        let valorMetros = parseInt(prompt("Digite um valor em Metros que te direi o mesmo em Centimetros e Milimetros"))
        let cm = valorMetros * 100
        alert (`${valorMetros} Em centimetros é ${cm}`)
        let ml = valorMetros * 1000
        alert (`${valorMetros} Em Milimetros é ${ml}`)
        
    </script>
</body>
</html>
