<body>
    <script>
     let peso = Number(prompt("Digite o seu Peso"))
     let altura = parseFloat(prompt("Digite a sua Altura"))

     let imc = peso / (altura * altura)

     alert("O seu IMC é: " + imc)

     if (imc <=18,5) {
        alert("Abaixo do peso")
     }
    </script>
</body>
